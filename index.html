<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>필사</title>
  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f3;
      --text-primary: #1a1a1a;
      --text-secondary: #6b6b6b;
      --text-tertiary: #b0b0b0;
      --border: rgba(0, 0, 0, 0.12);
      --border-mid: rgba(0, 0, 0, 0.22);
      --green: #1D9E75;
      --green-dark: #0F6E56;
      --red: #A32D2D;
      --radius: 8px;
      --font: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      --font-size: 15px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-primary: #1c1c1e;
        --bg-secondary: #2c2c2e;
        --text-primary: #f0f0f0;
        --text-secondary: #9a9a9a;
        --text-tertiary: #555;
        --border: rgba(255, 255, 255, 0.1);
        --border-mid: rgba(255, 255, 255, 0.2);
        --red: #e06060;
      }
    }

    :root[data-theme="dark"] {
      --bg-primary: #1c1c1e;
      --bg-secondary: #2c2c2e;
      --text-primary: #f0f0f0;
      --text-secondary: #9a9a9a;
      --text-tertiary: #555;
      --border: rgba(255, 255, 255, 0.1);
      --border-mid: rgba(255, 255, 255, 0.2);
      --red: #e06060;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      font-family: var(--font);
      background: var(--bg-secondary);
      color: var(--text-primary);
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-height: 100vh;
    }

    #toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 0.5px solid var(--border);
      background: var(--bg-secondary);
      flex-shrink: 0;
    }

    #toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    #app-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      flex-shrink: 0;
    }

    #progress-bar-wrap {
      flex: 1;
      max-width: 180px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: var(--green);
      border-radius: 2px;
      transition: width 0.2s;
    }

    #progress-label {
      font-size: 12px;
      color: var(--text-secondary);
      min-width: 34px;
      text-align: right;
      flex-shrink: 0;
    }

    #toolbar-right {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #doc-select {
      min-width: 150px;
      max-width: 220px;
      font-size: 12px;
      padding: 5px 8px;
      border: 0.5px solid var(--border-mid);
      border-radius: var(--radius);
      background: var(--bg-primary);
      color: var(--text-primary);
    }

    .tool-btn {
      font-size: 12px;
      padding: 5px 11px;
      border: 0.5px solid var(--border-mid);
      border-radius: var(--radius);
      background: transparent;
      color: var(--text-primary);
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .tool-btn:hover {
      background: var(--border);
    }

    #copy-btn.copied {
      color: var(--green-dark);
      border-color: var(--green);
    }

    #panels {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 0.5px solid var(--border);
      background: var(--bg-primary);
    }

    .panel:last-child {
      border-right: none;
    }

    .panel-header {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      padding: 8px 16px 6px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      border-bottom: 0.5px solid var(--border);
      flex-shrink: 0;
      background: var(--bg-primary);
    }

    /* 원문 및 필사 공통 스크롤 영역 */
    .scroll-area {
      flex: 1;
      overflow-y: auto;
      position: relative;
      scroll-padding-bottom: 30vh;
    }

    .content-stack {
      position: relative;
      width: 100%;
      min-height: 100%;
    }

    .bottom-spacer {
      height: 50vh;
      width: 100%;
    }

    #source-paste {
      position: relative;
      display: block;
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      resize: none;
      font-size: var(--font-size);
      line-height: 1.85;
      font-family: var(--font);
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      color: transparent;
      caret-color: transparent;
      word-break: break-all;
      white-space: pre-wrap;
      overflow: hidden;
    }

    #source-paste.editing {
      opacity: 1;
      color: var(--text-primary);
      caret-color: var(--text-primary);
      pointer-events: auto;
    }

    #source-display {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 100%;
      padding: 16px;
      font-size: var(--font-size);
      line-height: 1.85;
      word-break: break-all;
      white-space: pre-wrap;
      pointer-events: none;
      font-family: var(--font);
    }

    #source-display.hidden {
      display: none;
    }

    .s-done {
      color: var(--text-tertiary);
    }

    .s-pending {
      color: var(--text-primary);
    }

    .s-newline {
      display: inline-block;
      color: var(--text-tertiary);
      font-size: 0.78em;
      line-height: 1;
      margin-left: 2px;
      transform: translateY(-0.08em);
    }

    .s-error-char {
      color: var(--red);
      text-decoration: underline;
      text-decoration-color: var(--red);
      background-color: rgba(224, 96, 96, 0.15);
      border-radius: 3px;
    }

    /* 다음 입력 위치 커서 — 정상(초록) */
    .s-cursor {
      position: relative;
    }

    .s-cursor::before {
      content: '';
      position: absolute;
      left: -1px;
      top: 0.12em;
      width: 2px;
      height: 1.2em;
      background: var(--green);
      border-radius: 1px;
      animation: blink 1s step-end infinite;
    }

    /* 다음 입력 위치 커서 — 오타 중(빨강) */
    .s-cursor-err {
      position: relative;
    }

    .s-cursor-err::before {
      content: '';
      position: absolute;
      left: -1px;
      top: 0.12em;
      width: 2px;
      height: 1.2em;
      background: var(--red);
      border-radius: 1px;
      animation: blink 1s step-end infinite;
    }

    #edit-hint {
      font-size: 11px;
      color: var(--text-tertiary);
      padding: 4px 16px 6px;
      text-align: right;
      flex-shrink: 0;
    }

    /* 필사 */
    #right-panel {
      position: relative;
    }

    #typed-textarea {
      position: relative;
      display: block;
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      resize: none;
      font-size: var(--font-size);
      line-height: 1.85;
      font-family: var(--font);
      padding: 16px;
      z-index: 2;
      color: transparent;
      caret-color: var(--text-primary);
      cursor: text;
      word-break: break-all;
      white-space: pre-wrap;
      overflow: hidden;
    }

    #typed-textarea::selection {
      background: rgba(29, 158, 117, 0.3);
    }

    #typed-display {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 100%;
      padding: 16px;
      font-size: var(--font-size);
      line-height: 1.85;
      word-break: break-all;
      white-space: pre-wrap;
      pointer-events: none;
      z-index: 1;
      font-family: var(--font);
    }

    .t-correct {
      color: var(--text-primary);
    }

    .t-incorrect {
      color: var(--red);
      text-decoration: underline;
      text-decoration-color: var(--red);
      background-color: rgba(224, 96, 96, 0.15);
      border-radius: 3px;
    }

    .t-composing {
      color: var(--text-secondary);
      border-bottom: 1.5px solid var(--text-secondary);
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0
      }
    }

    #stats {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 8px 16px;
      border-top: 0.5px solid var(--border);
      background: var(--bg-secondary);
      flex-shrink: 0;
      overflow-x: auto;
    }

    .stat {
      font-size: 11px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .stat b {
      font-weight: 600;
      color: var(--text-primary);
    }

    #completion-badge {
      margin-left: auto;
      color: var(--green-dark);
      display: none;
    }

    #completion-badge.visible {
      display: block;
    }

    @media (max-width: 760px) {
      #app {
        height: 100dvh;
        max-height: 100dvh;
      }

      #toolbar {
        align-items: stretch;
        flex-direction: column;
        gap: 8px;
        padding: 8px 10px;
      }

      #toolbar-left,
      #toolbar-right {
        width: 100%;
      }

      #toolbar-right {
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 1px;
      }

      #doc-select {
        min-width: 128px;
      }

      .tool-btn {
        padding: 5px 9px;
      }

      #panels {
        flex-direction: column;
      }

      .panel {
        min-height: 0;
        border-right: none;
      }

      #left-panel {
        flex: 0 0 42%;
        border-bottom: 0.5px solid var(--border);
      }

      #right-panel {
        flex: 1 1 58%;
      }

      .panel-header {
        padding: 6px 12px 5px;
      }

      #source-paste,
      #source-display,
      #typed-textarea,
      #typed-display {
        padding: 12px;
      }

      #stats {
        gap: 14px;
        padding: 7px 10px;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="toolbar">
      <div id="toolbar-left">
        <span id="app-title">✍ 필사</span>
        <div id="progress-bar-wrap">
          <div id="progress-bar"></div>
        </div>
        <span id="progress-label">0%</span>
      </div>
      <div id="toolbar-right">
        <select id="doc-select" title="저장된 원문"></select>
        <button class="tool-btn" id="save-doc-btn" title="현재 원문 저장">저장</button>
        <button class="tool-btn" id="new-doc-btn" title="새 원문">새 글</button>
        <button class="tool-btn" id="theme-btn" title="테마 변경">🌙</button>
        <button class="tool-btn" id="font-dec-btn" title="글자 작게">A-</button>
        <button class="tool-btn" id="font-inc-btn" title="글자 크게">A+</button>
        <button class="tool-btn" id="reset-btn" onclick="resetTyping()">초기화</button>
        <button class="tool-btn" id="copy-btn" onclick="copyResult()">복사</button>
      </div>
    </div>
    <div id="panels">
      <div class="panel" id="left-panel">
        <div class="panel-header">원문</div>
        <div id="source-wrap" class="scroll-area">
          <div class="content-stack">
            <div id="source-display"></div>
            <textarea id="source-paste" placeholder="여기에 필사할 글을 붙여넣으세요." spellcheck="false" autocomplete="off"
              autocorrect="off" autocapitalize="off"></textarea>
          </div>
          <div class="bottom-spacer"></div>
        </div>
        <div id="edit-hint">클릭해서 편집</div>
      </div>
      <div class="panel" id="right-panel">
        <div class="panel-header">필사</div>
        <div id="typed-area" class="scroll-area">
          <div class="content-stack">
            <div id="typed-display"></div>
            <textarea id="typed-textarea" spellcheck="false" autocomplete="off" autocorrect="off"
              autocapitalize="off"></textarea>
          </div>
          <div class="bottom-spacer"></div>
        </div>
      </div>
    </div>
    <div id="stats">
      <div class="stat">입력 <b id="stat-typed">0</b>자</div>
      <div class="stat">정확도 <b id="stat-acc">—</b></div>
      <div class="stat">오류 <b id="stat-err">0</b>자</div>
      <div class="stat">속도 <b id="stat-wpm">—</b></div>
      <div class="stat">연속 <b id="stat-streak">0</b>자</div>
      <div class="stat" id="completion-badge">완료</div>
    </div>
  </div>
  <script>
    const sourcePaste = document.getElementById('source-paste');
    const sourceDisplay = document.getElementById('source-display');
    const typedTextarea = document.getElementById('typed-textarea');
    const typedDisplay = document.getElementById('typed-display');
    const sourceWrap = document.getElementById('source-wrap');
    const typedArea = document.getElementById('typed-area');
    const progressBar = document.getElementById('progress-bar');
    const progressLabel = document.getElementById('progress-label');
    const editHint = document.getElementById('edit-hint');
    const docSelect = document.getElementById('doc-select');
    const saveDocBtn = document.getElementById('save-doc-btn');
    const newDocBtn = document.getElementById('new-doc-btn');
    const statTyped = document.getElementById('stat-typed');
    const statErr = document.getElementById('stat-err');
    const statAcc = document.getElementById('stat-acc');
    const statWpm = document.getElementById('stat-wpm');
    const statStreak = document.getElementById('stat-streak');
    const completionBadge = document.getElementById('completion-badge');

    function autoResize(el) {
      if (!el) return;
      // 텍스트 영역 크기 재계산 중 스크롤이 위로 튀는 현상 방지
      const scrollAreas = document.querySelectorAll('.scroll-area');
      const tops = Array.from(scrollAreas).map(a => a.scrollTop);

      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';

      scrollAreas.forEach((a, i) => {
        a.scrollTop = tops[i];
      });
    }

    function autoResizeTyped(isShrinking = false) {
      const el = typedTextarea;
      if (isShrinking) {
        autoResize(el);
      } else {
        // Fast resize: only grow if scrollHeight is larger than clientHeight
        if (el.scrollHeight > el.clientHeight) {
          el.style.height = el.scrollHeight + 'px';
        }
      }
    }

    let source = '', typed = '', composing = '';
    let errors = 0, started = false, startTime = null;
    let isComposing = false, editing = false;
    let prevTypedLen = 0, currentStreak = 0;
    let currentDocId = null;

    const NORM = {
      '\u2018': "'", '\u2019': "'", '\u201C': '"', '\u201D': '"',
      '\u2013': '-', '\u2014': '-', '\u2015': '-',
      '\u2026': '...', '\uFF5E': '~', '\u3000': ' '
    };
    function normalize(s) { let r = ''; for (const c of s) r += (NORM[c] !== undefined ? NORM[c] : c); return r; }
    function eq(a, b) { return normalize(a) === normalize(b); }
    function esc(c) {
      return c === '&' ? '&amp;' : c === '<' ? '&lt;' : c === '>' ? '&gt;' : c;
    }

    let sourceSpans = [];
    let lastCursorIdx = 0;
    let lastSourceSnapshot = '';

    function setSourceSpanClass(i, className) {
      const span = sourceSpans[i];
      if (span && span.className !== className) span.className = className;
    }

    function initSourceDisplay() {
      source = sourcePaste.value;
      if (!source) {
        sourceDisplay.innerHTML = '<span style="color:var(--text-tertiary);font-size:14px;">여기에 필사할 글을 붙여넣으세요.</span>';
        sourceSpans = [];
        lastSourceSnapshot = '';
        return;
      }

      const fragment = document.createDocumentFragment();
      sourceSpans = [];

      for (let i = 0; i < source.length; i++) {
        const span = document.createElement('span');
        const c = source[i];
        if (c === '\n') {
          span.textContent = '↵';
          span.className = 's-newline s-pending';
          fragment.appendChild(span);
          fragment.appendChild(document.createElement('br'));
        } else {
          span.textContent = c;
          span.className = 's-pending';
          fragment.appendChild(span);
        }
        sourceSpans.push(span);
      }

      sourceDisplay.innerHTML = '';
      sourceDisplay.appendChild(fragment);
      lastSourceSnapshot = source;
      lastCursorIdx = 0;
      autoResize(sourcePaste);
      renderSource(true);
    }

    function renderSource(forceFull = false) {
      source = sourcePaste.value;
      if (!source) {
        sourceDisplay.innerHTML = '<span style="color:var(--text-tertiary);font-size:14px;">여기에 필사할 글을 붙여넣으세요.</span>';
        sourceSpans = [];
        lastSourceSnapshot = '';
        return;
      }

      if (sourceSpans.length !== source.length || lastSourceSnapshot !== source) {
        initSourceDisplay();
        return;
      }

      const tLen = typed.length + (isComposing ? 1 : 0);
      const prevIdx = tLen - 1;
      const hasError = prevIdx >= 0 && prevIdx < typed.length && !eq(typed[prevIdx], source[prevIdx]);
      const cursorIdx = Math.min(tLen, sourceSpans.length - 1);
      let start = 0;
      let end = sourceSpans.length - 1;

      if (!forceFull) {
        start = Math.max(0, Math.min(lastCursorIdx, cursorIdx, prevIdx) - 3);
        end = Math.min(sourceSpans.length - 1, Math.max(lastCursorIdx, cursorIdx, prevIdx) + 3);
      }

      for (let i = start; i <= end; i++) {
        if (i < prevIdx) {
          setSourceSpanClass(i, source[i] === '\n' ? 's-newline s-done' : 's-done');
        } else if (i === prevIdx && tLen > 0) {
          const targetClass = hasError ? 's-error-char' : 's-done';
          setSourceSpanClass(i, source[i] === '\n' ? `s-newline ${targetClass}` : targetClass);
        } else if (i === tLen) {
          const targetClass = hasError ? 's-cursor-err s-pending' : 's-cursor s-pending';
          setSourceSpanClass(i, source[i] === '\n' ? `s-newline ${targetClass}` : targetClass);
        } else {
          setSourceSpanClass(i, source[i] === '\n' ? 's-newline s-pending' : 's-pending');
        }
      }
      lastCursorIdx = cursorIdx;
    }

    function renderTyped() {
      source = sourcePaste.value;
      if (!source) {
        typedDisplay.innerHTML = '<span style="color:var(--text-tertiary);font-size:14px;">원문을 붙여넣으면 여기서 따라 쓸 수 있습니다.</span>';
        return;
      }

      const val = typedTextarea.value;

      if (val.length === 0 && !composing) {
        typedDisplay.innerHTML = '';
        return;
      }

      let html = '';
      let currentClass = null;
      let currentText = '';

      const flush = () => {
        if (currentText) {
          html += `<span class="${currentClass}">${currentText}</span>`;
          currentText = '';
        }
      };

      for (let i = 0; i < val.length; i++) {
        const ch = val[i], exp = source[i] || '';
        const d = ch === '\n' ? '<br>' : esc(ch);

        let cClass = eq(ch, exp) ? 't-correct' : 't-incorrect';
        if (isComposing && composing && i >= val.length - composing.length) {
          cClass = 't-composing';
        }

        if (cClass !== currentClass) {
          flush();
          currentClass = cClass;
        }
        currentText += d;
      }
      flush();

      typedDisplay.innerHTML = html;
    }

    function updateStats() {
      source = sourcePaste.value;
      const total = source.length;
      const cur = typed.length + (isComposing ? 1 : 0);
      const pct = total ? Math.round((cur / total) * 100) : 0;
      const clampedPct = Math.min(pct, 100);
      const extra = Math.max(typed.length - total, 0);
      progressBar.style.width = clampedPct + '%';
      progressLabel.textContent = extra ? `${clampedPct}% +${extra}` : clampedPct + '%';
      statTyped.textContent = typed.length;
      statErr.textContent = errors;
      statAcc.textContent = typed.length > 0
        ? Math.max(0, Math.round(((typed.length - errors) / typed.length) * 100)) + '%'
        : '—';

      currentStreak = 0;
      for (let i = typed.length - 1; i >= 0; i--) {
        if (!eq(typed[i], source[i] || '')) break;
        currentStreak++;
      }
      statStreak.textContent = currentStreak;

      if (started && startTime && typed.length > 0) {
        const minutes = Math.max((Date.now() - startTime) / 60000, 1 / 60);
        statWpm.textContent = Math.round(typed.length / minutes) + '자/분';
      } else {
        statWpm.textContent = '—';
      }

      completionBadge.classList.toggle('visible', total > 0 && typed.length === total && errors === 0);
    }

    function syncFromTextarea() {
      let val = typedTextarea.value;
      source = sourcePaste.value;

      if (val === typed) {
        prevTypedLen = val.length;
        return;
      }

      let newErr = 0;
      for (let i = 0; i < val.length; i++) {
        if (!eq(val[i], source[i] || '')) newErr++;
      }

      const isShrinking = val.length < typed.length;
      const needsFullSourceRender = isShrinking || Math.abs(val.length - typed.length) > 1;
      typed = val; errors = newErr;
      prevTypedLen = val.length;

      if (typed.length > 0 && !started) { started = true; startTime = Date.now(); }
      renderSource(needsFullSourceRender); renderTyped(); updateStats();
      autoResizeTyped(isShrinking);
      debouncedSaveState();
    }

    function copyResult() {
      const btn = document.getElementById('copy-btn');
      if (!typed) return;
      const done = () => {
        btn.textContent = '복사됨!'; btn.classList.add('copied');
        setTimeout(() => { btn.textContent = '복사'; btn.classList.remove('copied'); }, 1500);
      };
      if (navigator.clipboard) {
        navigator.clipboard.writeText(typed).then(done).catch(() => fallbackCopy(done));
      } else { fallbackCopy(done); }
    }
    function fallbackCopy(cb) {
      const ta = document.createElement('textarea');
      ta.value = typed; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta); cb();
    }

    /* 원문 편집 */
    document.getElementById('left-panel').addEventListener('click', () => {
      if (editing) return;
      editing = true;
      sourcePaste.classList.add('editing');
      sourceDisplay.classList.add('hidden');
      editHint.textContent = '다른 곳 클릭 시 편집 완료';
      sourcePaste.focus();
    });
    sourcePaste.addEventListener('blur', () => {
      editing = false;
      sourcePaste.classList.remove('editing');
      sourceDisplay.classList.remove('hidden');
      editHint.textContent = '클릭해서 편집';

      // 원문이 수정되었으므로 기존 필사 내용과 비교하여 오타 재계산 (초기화 방지)
      source = sourcePaste.value;
      
      initSourceDisplay();

      const val = typedTextarea.value;
      let newErr = 0;
      for (let i = 0; i < val.length; i++) {
        if (!eq(val[i], source[i] || '')) newErr++;
      }
      errors = newErr;

      renderSource(true); renderTyped(); updateStats();
      debouncedSaveState();
    });

    /* IME (한글 등 조합 문자) */
    typedTextarea.addEventListener('compositionstart', () => { isComposing = true; });
    typedTextarea.addEventListener('compositionupdate', (e) => {
      composing = e.data || '';
      renderSource(); renderTyped(); updateStats();
      autoResizeTyped(false);
    });
    typedTextarea.addEventListener('compositionend', () => {
      isComposing = false; composing = '';
      setTimeout(() => syncFromTextarea(), 0);
    });

    /* 키 입력 */
    typedTextarea.addEventListener('input', (e) => {
      if (isComposing) {
        renderSource();
        renderTyped();
        updateStats();
        autoResizeTyped(false);
        return;
      }
      syncFromTextarea();
    });

    typedArea.addEventListener('scroll', () => {
      if (sourceWrap.scrollTop !== typedArea.scrollTop) {
        sourceWrap.scrollTop = typedArea.scrollTop;
      }
    });

    sourceWrap.addEventListener('scroll', () => {
      if (typedArea.scrollTop !== sourceWrap.scrollTop) {
        typedArea.scrollTop = sourceWrap.scrollTop;
      }
    });

    // 하단 빈 공간(여백) 클릭 시 텍스트 영역 끝으로 포커스 이동
    typedArea.addEventListener('click', (e) => {
      if (e.target === typedArea || e.target.classList.contains('bottom-spacer') || e.target.classList.contains('content-stack')) {
        typedTextarea.focus();
        typedTextarea.selectionStart = typedTextarea.selectionEnd = typedTextarea.value.length;
      }
    });
    sourceWrap.addEventListener('click', (e) => {
      if (editing && (e.target === sourceWrap || e.target.classList.contains('bottom-spacer') || e.target.classList.contains('content-stack'))) {
        sourcePaste.focus();
        sourcePaste.selectionStart = sourcePaste.selectionEnd = sourcePaste.value.length;
      }
    });

    function resetTyping() {
      if (!confirm('작성한 내용을 모두 지우고 처음부터 다시 시작하시겠습니까?')) return;
      typed = ''; composing = ''; errors = 0;
      started = false; startTime = null; isComposing = false;
      prevTypedLen = 0;
      typedTextarea.value = '';
      renderSource(true); renderTyped(); updateStats();
      autoResizeTyped(true);
      saveState();
      typedTextarea.focus();
    }

    let currentFontSize = 15;
    function changeFontSize(delta) {
      currentFontSize += delta;
      if (currentFontSize < 10) currentFontSize = 10;
      if (currentFontSize > 30) currentFontSize = 30;
      document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
      autoResize(sourcePaste);
      autoResizeTyped(true);
      saveState();
    }
    document.getElementById('font-inc-btn').addEventListener('click', () => changeFontSize(2));
    document.getElementById('font-dec-btn').addEventListener('click', () => changeFontSize(-2));

    let saveTimeout = null;
    function debouncedSaveState() {
      if (saveTimeout) clearTimeout(saveTimeout);
      saveTimeout = setTimeout(saveState, 500);
    }

    const STORAGE_KEY = 'transcription_app_state';
    const LIBRARY_KEY = 'transcription_doc_library';

    function getLibrary() {
      try {
        return JSON.parse(localStorage.getItem(LIBRARY_KEY) || '[]');
      } catch (e) {
        console.error('Failed to load library', e);
        return [];
      }
    }

    function setLibrary(library) {
      localStorage.setItem(LIBRARY_KEY, JSON.stringify(library));
    }

    function makeDocTitle(text) {
      const firstLine = text.split('\n').map(line => line.trim()).find(Boolean);
      if (!firstLine) return '제목 없는 글';
      return firstLine.length > 24 ? firstLine.slice(0, 24) + '…' : firstLine;
    }

    function renderDocSelect() {
      const library = getLibrary().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      docSelect.innerHTML = '';

      const currentOption = document.createElement('option');
      currentOption.value = '';
      currentOption.textContent = '현재 글';
      docSelect.appendChild(currentOption);

      library.forEach(doc => {
        const option = document.createElement('option');
        option.value = doc.id;
        option.textContent = doc.title || makeDocTitle(doc.source || '');
        docSelect.appendChild(option);
      });

      docSelect.value = currentDocId || '';
    }

    function saveCurrentDoc() {
      const sourceText = sourcePaste.value;
      if (!sourceText.trim()) {
        sourcePaste.focus();
        return;
      }

      const library = getLibrary();
      const now = Date.now();
      let doc = currentDocId ? library.find(item => item.id === currentDocId) : null;

      if (!doc) {
        doc = { id: 'doc-' + now };
        library.push(doc);
        currentDocId = doc.id;
      }

      doc.title = doc.title || makeDocTitle(sourceText);
      doc.source = sourceText;
      doc.typed = typedTextarea.value;
      doc.updatedAt = now;

      setLibrary(library);
      renderDocSelect();
      saveDocBtn.textContent = '저장됨';
      setTimeout(() => { saveDocBtn.textContent = '저장'; }, 1200);
      saveState();
    }

    function loadDoc(id) {
      if (!id) {
        currentDocId = null;
        saveState();
        renderDocSelect();
        return;
      }

      const doc = getLibrary().find(item => item.id === id);
      if (!doc) return;

      currentDocId = doc.id;
      sourcePaste.value = doc.source || '';
      typedTextarea.value = doc.typed || '';
      typed = '';
      errors = 0;
      started = Boolean(typedTextarea.value);
      startTime = started ? Date.now() : null;
      isComposing = false;
      composing = '';
      initSourceDisplay();
      syncFromTextarea();
      renderSource(true); renderTyped(); updateStats();
      autoResize(sourcePaste);
      autoResizeTyped(true);
      saveState();
      renderDocSelect();
    }

    function newDocument() {
      if ((sourcePaste.value || typedTextarea.value) && !confirm('현재 글을 닫고 새 글을 시작하시겠습니까?')) return;
      currentDocId = null;
      sourcePaste.value = '';
      typedTextarea.value = '';
      typed = ''; composing = ''; errors = 0;
      started = false; startTime = null; isComposing = false;
      prevTypedLen = 0; currentStreak = 0;
      initSourceDisplay();
      renderTyped(); updateStats();
      autoResize(sourcePaste);
      autoResizeTyped(true);
      saveState();
      renderDocSelect();
      sourcePaste.classList.add('editing');
      sourceDisplay.classList.add('hidden');
      editing = true;
      editHint.textContent = '다른 곳 클릭 시 편집 완료';
      sourcePaste.focus();
    }

    function saveState() {
      const state = {
        source: sourcePaste.value,
        typed: typedTextarea.value,
        fontSize: currentFontSize,
        currentDocId,
        started,
        startTime
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }
    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const state = JSON.parse(saved);
          if (state.source) sourcePaste.value = state.source;
          if (state.typed) {
            typedTextarea.value = state.typed;
            syncFromTextarea();
          }
          currentDocId = state.currentDocId || null;
          started = Boolean(state.started && state.typed);
          startTime = started ? (state.startTime || Date.now()) : null;
          if (state.fontSize && state.fontSize !== 15) {
            changeFontSize(state.fontSize - 15);
          }
        } catch (e) {
          console.error('Failed to load state', e);
        }
      }
      renderDocSelect();
    }

    saveDocBtn.addEventListener('click', saveCurrentDoc);
    newDocBtn.addEventListener('click', newDocument);
    docSelect.addEventListener('change', () => loadDoc(docSelect.value));

    let currentTheme = localStorage.getItem('transcription_theme') || 'auto';
    function applyTheme() {
      if (currentTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.getElementById('theme-btn').textContent = '☀️';
      } else if (currentTheme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        document.getElementById('theme-btn').textContent = '🌙';
      } else {
        document.documentElement.removeAttribute('data-theme');
        const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.getElementById('theme-btn').textContent = isDark ? '☀️' : '🌙';
      }
    }

    document.getElementById('theme-btn').addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark' ||
        (!document.documentElement.hasAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      currentTheme = isDark ? 'light' : 'dark';
      localStorage.setItem('transcription_theme', currentTheme);
      applyTheme();
    });

    applyTheme();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (currentTheme === 'auto') applyTheme();
    });

    loadState();
    renderSource(); renderTyped(); updateStats();
  </script>
</body>

</html>
